<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <!--
      Тема применяется до загрузки бандла: иначе при выбранной светлой теме
      первый кадр моргнёт тёмным. Ключ обязан совпадать с THEME_STORAGE_KEY
      из src/shared/lib/theme.ts. См. ADR 0009.
    -->
    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem('arm-theme') === 'light' ? 'light' : 'dark'
      } catch (error) {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
    <title>АРМ диспетчера ОДС — прогнозирование аварий коллекторов</title>
    <!--
      Шрифты интерфейса: Golos Text (родная кириллица) и JetBrains Mono с
      tabular-nums для чисел в таблицах. Веса только 400 и 500 — см.
      docs/05-ui-kit.md. Если сети нет, подхватывается системный фолбэк из
      src/styles/tokens.css.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
