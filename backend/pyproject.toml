[project]
name = "arm-ods-backend"
version = "0.1.0"
description = "REST API и конвейер прогнозирования аварий инженерных коллекторов"
requires-python = ">=3.12"

# Набор api. Постоянно работающий процесс. Обоснование каждой строки — спецификация §2.
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
# Набор ml. Процесс конвейера. В образ api не попадает.
ml = ["scikit-learn>=1.5"]
# Набор ingest. Разовый разбор выгрузок. В проде не установлен.
ingest = ["openpyxl>=3.1"]
# Набор mlflow. Реестр версий моделей. Отдельный сервис.
# psycopg тут свой: образ mlflow ставится без зависимостей проекта.
mlflow = ["mlflow>=2.17", "psycopg[binary]>=3.2"]
# Инструменты разработки. В образы не попадают.
# httpx2 нужен fastapi.testclient. Раньше он приезжал транзитивно, starlette 1.6 его не тянет.
dev = ["ruff>=0.7", "pytest>=8.3", "mypy>=1.13", "httpx2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "error",
    # starlette 1.6 сам зовёт устаревший алиас anyio. Наш код на это не влияет.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
