name: arm-ods

# Адрес публикации портов. Умолчание это петлевой интерфейс, и менять его надо
# осознанно: `BIND_HOST=0.0.0.0 docker compose up -d`.
#
# На Ubuntu опубликованный порт обходит ufw. Docker пишет свои правила DNAT в
# таблицу nat раньше, чем ufw ставит свои в filter, поэтому `ufw deny 5432` не
# закрывает базу. Строка "5432:5432" на сервере с внешним адресом означает
# Postgres с паролем `arm` в открытом интернете.
#
# Контейнеры между собой ходят по именам служб внутри сети compose, поэтому
# публикация им не нужна вовсе. Она нужна только процессам на хосте: тестам,
# дев-серверу фронтенда, nginx в проде. Все они ходят через петлю.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-arm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arm}
      POSTGRES_DB: ${POSTGRES_DB:-arm}
    ports:
      - "${BIND_HOST:-127.0.0.1}:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./scripts/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-arm}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-arm}:${POSTGRES_PASSWORD:-arm}@db:5432/${POSTGRES_DB:-arm}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      AUTH_SECRET: ${AUTH_SECRET:-}
      AUTH_TOKEN_TTL_MINUTES: ${AUTH_TOKEN_TTL_MINUTES:-480}
      SEED_PASSWORD: ${SEED_PASSWORD:-collector}
      # Панель тестовых учёток на экране входа. Раздаёт логины и пароли без
      # входа в систему, поэтому по умолчанию выключена. ADR 0007.
      TEST_STAND: ${TEST_STAND:-}
      # Ключ потока СМВУ. Пустой ключ выключает приём потока. ADR 0017.
      STREAM_TOKEN: ${STREAM_TOKEN:-}
    ports:
      - "${BIND_HOST:-127.0.0.1}:8000:8000"
    volumes:
      - ./app:/srv/app:ro
      - ./migrations:/srv/migrations:ro
    depends_on:
      db:
        condition: service_healthy

  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    environment:
      # Список хостов, с которыми сервер соглашается работать. MLflow 3
      # проверяет заголовок Host и защищается от перепривязки DNS. По
      # умолчанию он берёт петлю и частные адреса, но не имена. Контейнеры
      # ходят по имени службы, поэтому `mlflow:5000` не проходил, и реестр
      # версий отвечал 403 «Invalid Host header».
      #
      # Переменная заменяет список по умолчанию целиком, а не дополняет его,
      # поэтому петлевые адреса перечислены здесь же: по ним ходит браузер.
      MLFLOW_SERVER_ALLOWED_HOSTS: >-
        mlflow:5000,localhost:5000,127.0.0.1:5000,[::1]:5000
    command:
      - uv
      - run
      - --no-sync
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - postgresql+psycopg://${POSTGRES_USER:-arm}:${POSTGRES_PASSWORD:-arm}@db:5432/mlflow
      - --artifacts-destination
      - /srv/artifacts
    ports:
      - "${BIND_HOST:-127.0.0.1}:5000:5000"
    volumes:
      - ./artifacts:/srv/artifacts
    depends_on:
      db:
        condition: service_healthy

  # Разовые команды. Запуск: docker compose run --rm pipeline <команда>
  pipeline:
    build:
      context: .
      dockerfile: Dockerfile.pipeline
    profiles: ["tools"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-arm}:${POSTGRES_PASSWORD:-arm}@db:5432/${POSTGRES_DB:-arm}
      # Двоеточия в подстановке нет намеренно. С `:-` пустое значение в .env
      # считается незаданным, и compose подставлял адрес реестра. Процесс
      # конвейера уходил к несуществующей службе и висел на ней пять минут,
      # прежде чем взять модель файлом. Форма `-` уважает пустое значение:
      # оно означает «реестра нет, читать из ARTIFACTS_DIR».
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI-http://mlflow:5000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # В образе нет git, и MLflow пишет об этом три абзаца на каждый вызов.
      # Логи от этого становятся нечитаемыми.
      GIT_PYTHON_REFRESH: quiet
    volumes:
      - ./app:/srv/app:ro
      - ./migrations:/srv/migrations:ro
      - ./data:/srv/data:ro
      - ./artifacts:/srv/artifacts
    depends_on:
      db:
        condition: service_healthy

  # Конвейер по расписанию: прогон раз в минуту. ADR 0017.
  # Запуск: docker compose --profile stream up -d scheduler smvu-stub
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.pipeline
    profiles: ["stream"]
    restart: unless-stopped
    command: ["uv", "run", "--no-sync", "python", "-m", "app.cli", "run-pipeline", "--every", "60"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-arm}:${POSTGRES_PASSWORD:-arm}@db:5432/${POSTGRES_DB:-arm}
      # Демонстрационная шкала уровней. Пусто значит пороги моделей. ADR 0018.
      DEMO_LEVELS: ${DEMO_LEVELS:-}
      # Журнал всех прогнозов в logs/forecasts.jsonl. Пусто значит выключен.
      # ADR 0022.
      FORECAST_LOG: ${FORECAST_LOG:-}
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI-http://mlflow:5000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      GIT_PYTHON_REFRESH: quiet
    volumes:
      - ./app:/srv/app:ro
      - ./migrations:/srv/migrations:ro
      - ./artifacts:/srv/artifacts
      - ./logs:/srv/logs
    depends_on:
      db:
        condition: service_healthy

  # Заглушка потока СМВУ. Проигрывает неделю выгрузки по кругу в текущем
  # времени. Отрезок готовит команда `ingest` в data/stream. ADR 0017.
  smvu-stub:
    build:
      context: .
      dockerfile: Dockerfile.pipeline
    profiles: ["stream"]
    restart: unless-stopped
    command: ["uv", "run", "--no-sync", "python", "-m", "app.cli", "stream-stub",
              "--stream-dir", "/srv/data/stream"]
    environment:
      STREAM_API_URL: http://api:8000/api/v1/stream/events
      STREAM_TOKEN: ${STREAM_TOKEN:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./app:/srv/app:ro
      - ./data:/srv/data:ro
    depends_on:
      - api

  # Разведочный анализ и подбор модели. Служба держит оба занятия, потому что
  # набор research описывает их оба (pyproject.toml, спецификация §2).
  #
  # JupyterLab: docker compose --profile tools up research, затем
  # http://localhost:8888.
  #
  # Скрипты направления лежат вне каталога backend, поэтому служба монтирует
  # корень репозитория в /repo. Запуск витрины направления доступа:
  #   docker compose --profile tools run --rm -w /repo/ml/access research \
  #       python 01_dataset.py
  #
  # В прод этот сервис не идёт.
  research:
    build:
      context: .
      dockerfile: Dockerfile.research
    profiles: ["tools"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-arm}:${POSTGRES_PASSWORD:-arm}@db:5432/${POSTGRES_DB:-arm}
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-http://mlflow:5000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # В образе нет git, и MLflow пишет об этом три абзаца на каждый вызов.
      # Логи от этого становятся нечитаемыми.
      GIT_PYTHON_REFRESH: quiet
    # Только петлевой интерфейс: JupyterLab поднят без токена.
    ports:
      - "127.0.0.1:8888:8888"
    volumes:
      - .:/srv
      # Корень репозитория: ml/, eda/out и notebooks/out лежат выше backend.
      - ..:/repo
    depends_on:
      db:
        condition: service_healthy

  # Тесты и линт. Запуск: docker compose run --rm dev <команда>
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    profiles: ["tools"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-arm}:${POSTGRES_PASSWORD:-arm}@db:5432/${POSTGRES_DB:-arm}_test
      LOG_LEVEL: WARNING
    volumes:
      - .:/srv
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
